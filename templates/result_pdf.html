<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Quiz Result</title>
    <style>
        body{font-family:DejaVu Sans, sans-serif;font-size:12px;}
        h1{font-size:18px;margin-bottom:10px;}
        p{margin:4px 0;}
    </style>
</head>
<body>
    <h1>MCQ Guard AI – Quiz Result</h1>
    <p><strong>User:</strong> {{ user.username }}</p>
    <p><strong>Date:</strong> {{ date|date:"d M Y H:i" }}</p>
    {% comment %} <p><strong>Subject:</strong> {{ subject|default:"-" }}</p> {% endcomment %}
    <p><strong>Score:</strong> {{ score }}/{{ total }}</p>
</body>
</html>
